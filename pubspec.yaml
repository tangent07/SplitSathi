name: splitsathi
description: Split bills. Not friendships.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_contacts: ^2.0.1
  pdf: ^3.11.1
  csv: ^6.0.0
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  image_picker: ^1.0.7
  google_mlkit_text_recognition: ^0.13.0

  # UI
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # Local Storage
  shared_preferences: ^2.2.2


  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3

  cupertino_icons: ^1.0.2
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_messaging: ^16.1.3
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.2
  font_awesome_flutter: ^11.0.0
  flutter_dotenv: ^6.0.0
  confetti: ^0.8.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F97316"
  color_dark: "#F97316"
  image: assets/icons/wallet_icon.png
  image_dark: assets/icons/wallet_icon.png
  android_12:
    color: "#F97316"
    color_dark: "#F97316"
    image: assets/icons/wallet_icon.png
    image_dark: assets/icons/wallet_icon.png
  android: true
  ios: true
  web: false